<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>

  <title>Rick Roll</title>
</head>

<body class="relative min-h-screen overflow-hidden">

  <!-- Background -->
  <div
    class="fixed inset-0 bg-cover bg-center -z-20"
    style="background-image: url('static/assets/rickroll-roll.gif');"
  ></div>

  <!-- Dark Overlay -->
  <div class="fixed inset-0 bg-black/70 backdrop-blur-sm -z-10"></div>

  <!-- Music -->
  <audio id="bg-music" autoplay loop>
    <source src="static/assets/music.mp3" type="audio/mpeg" />
  </audio>

  <!-- Content -->
  <div class="relative flex min-h-screen items-center justify-center p-8">
    <div
      id="grid"
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 rounded-3xl bg-white/10 p-8 backdrop-blur-md border border-white/20 shadow-2xl"
    >
    </div>
  </div>
  <script src="static/index.js"></script>
</body>
</html>
